name: Build Cerpen Hozin APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Perlu write agar workflow bisa membuat tag + rilis sendiri (aturan
    # "SE auto mungkin": push ke main yang berhasil langsung jadi rilis).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/app/build.gradle)
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Version: $VER"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=sdkmanager
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Grant execute permission for gradlew
        run: chmod +x app/gradlew

      - name: Derive content key
        env:
          CERPEN_CONTENT_KEY: ${{ secrets.CERPEN_CONTENT_KEY }}
        run: |
          if [ -z "$CERPEN_CONTENT_KEY" ]; then
            echo "CERPEN_CONTENT_KEY secret belum dibuat/kosong — build dibatalkan." >&2
            exit 1
          fi
          KEY_B64=$(printf '%s' "$CERPEN_CONTENT_KEY" | openssl dgst -sha256 -binary | base64 -w0)
          echo "::add-mask::$KEY_B64"
          echo "CERPEN_CONTENT_KEY=$KEY_B64" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd app
          GRADLE_BIN=$(ls /opt/hostedtoolcache/gradle/*/x64/bin/gradle 2>/dev/null | sort -V | tail -1)
          if [ -n "$GRADLE_BIN" ]; then
            echo "Using cached Gradle: $GRADLE_BIN"
            "$GRADLE_BIN" assembleDebug --stacktrace
          else
            echo "No cached Gradle found, falling back to wrapper"
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CerpenHozin-debug
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create version tag
        if: github.ref == 'refs/heads/main'
        run: |
          if git rev-parse "v$APP_VERSION" >/dev/null 2>&1; then
            echo "Tag v$APP_VERSION sudah ada, lewati."
          else
            git tag "v$APP_VERSION"
            git push origin "v$APP_VERSION"
            echo "Tag v$APP_VERSION dibuat."
          fi

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Cerpen Hozin v${{ env.APP_VERSION }}
          generate_release_notes: true
          make_latest: true
          files: app/app/build/outputs/apk/debug/app-debug.apk
