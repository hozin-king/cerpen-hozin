name: Build Cerpen Hozin APK

on:
  push:
    branches: [main]
    tags: ['v*']
    # Push konten (data/*.enc) TIDAK boleh memicu build: workflow ini
    # gagal di step "Create version tag" bila tag sudah ada (insiden
    # run 42767259983, push konten 10 Nov 13:15). Build hanya untuk
    # perubahan kode aplikasi / workflow.
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Perlu write agar workflow bisa membuat tag + rilis sendiri (aturan
    # "SE auto mungkin": push ke main yang berhasil langsung jadi rilis).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/app/build.gradle)
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Version: $VER"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=sdkmanager
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Grant execute permission for gradlew
        run: chmod +x app/gradlew

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-linux-android
          cargo --version && rustc --version

      - name: Derive content key
        env:
          CERPEN_CONTENT_KEY: ${{ secrets.CERPEN_CONTENT_KEY }}
        run: |
          if [ -z "$CERPEN_CONTENT_KEY" ]; then
            echo "CERPEN_CONTENT_KEY secret belum dibuat/kosong — build dibatalkan." >&2
            exit 1
          fi
          KEY_B64=$(printf '%s' "$CERPEN_CONTENT_KEY" | openssl dgst -sha256 -binary | base64 -w0)
          echo "::add-mask::$KEY_B64"
          echo "CERPEN_CONTENT_KEY=$KEY_B64" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          cd app
          GRADLE_BIN=$(ls /opt/hostedtoolcache/gradle/*/x64/bin/gradle 2>/dev/null | sort -V | tail -1)
          if [ -n "$GRADLE_BIN" ]; then
            "$GRADLE_BIN" testDebugUnitTest --stacktrace
          else
            ./gradlew testDebugUnitTest --stacktrace
          fi

      - name: Prepare release keystore
        env:
          CERPEN_KEYSTORE_BASE64: ${{ secrets.CERPEN_KEYSTORE_BASE64 }}
          CERPEN_KEYSTORE_PASSWORD: ${{ secrets.CERPEN_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$CERPEN_KEYSTORE_BASE64" ] || [ -z "$CERPEN_KEYSTORE_PASSWORD" ]; then
            echo "Secret keystore rilis belum dibuat/kosong — build dibatalkan." >&2
            exit 1
          fi
          printf '%s' "$CERPEN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cerpen-release.keystore"
          echo "CERPEN_KEYSTORE_FILE=$RUNNER_TEMP/cerpen-release.keystore" >> "$GITHUB_ENV"
          echo "::add-mask::$CERPEN_KEYSTORE_PASSWORD"
          echo "CERPEN_KEYSTORE_PASSWORD=$CERPEN_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          cd app
          GRADLE_BIN=$(ls /opt/hostedtoolcache/gradle/*/x64/bin/gradle 2>/dev/null | sort -V | tail -1)
          if [ -n "$GRADLE_BIN" ]; then
            echo "Using cached Gradle: $GRADLE_BIN"
            "$GRADLE_BIN" assembleRelease --stacktrace
          else
            echo "No cached Gradle found, falling back to wrapper"
            ./gradlew assembleRelease --stacktrace
          fi

      # PoC rust-contentguard — verifikasi (HANYA di branch PoC; hapus
      # step ini bila PoC di-merge). Kunci HANYA dipakai in-memory di
      # skrip ini; yang dicetak hanya boolean + ukuran (bukan nilai kunci).
      - name: Verify Rust contentguard (PoC)
        if: github.ref == 'refs/heads/rust-contentguard-poc'
        env:
          CERPEN_CONTENT_KEY: ${{ env.CERPEN_CONTENT_KEY }}
        run: |
          APK="app/app/build/outputs/apk/release/app-release.apk"
          sha256sum "$APK"
          python3 - <<'PY'
          import base64, os, sys, zipfile
          MASK = bytes([0x3C, 0xA7, 0x19, 0xE2, 0x6B, 0xD4, 0x08, 0x5F])
          apk = "app/app/build/outputs/apk/release/app-release.apk"
          size = os.path.getsize(apk)
          print("apk_size:", size)
          print("apk_leq_5MB:", size <= 5_000_000)
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              print("has_arm64_lib:", "lib/arm64-v8a/libcontentguard.so" in names)
              data = z.read("lib/arm64-v8a/libcontentguard.so")
          print("rust_so_size:", len(data))
          raw = base64.b64decode(os.environ["CERPEN_CONTENT_KEY"])
          assert len(raw) == 32
          masked = bytes(b ^ MASK[i % len(MASK)] for i, b in enumerate(raw))
          print("masked_bytes_found:", masked in data)
          print("raw_key_found:", raw in data)
          ok = size <= 5_000_000 and masked in data and raw not in data
          print("POC_CHECK_OK:", ok)
          sys.exit(0 if ok else 1)
          PY
          NDK_BIN="$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          unzip -p "$APK" lib/arm64-v8a/libcontentguard.so > /tmp/libcontentguard-poc.so
          "$NDK_BIN/llvm-nm" -D --defined-only /tmp/libcontentguard-poc.so | grep "Java_com_hozinking_cerpen_ContentGuard_fetchKey" || { echo "SIMBOL JNI TIDAK DITEMUKAN" >&2; exit 1; }

      - name: Verify endpoints hidden (Fase 2)
        if: github.ref == 'refs/heads/rust-contentguard-poc'
        run: |
          APK="app/app/build/outputs/apk/release/app-release.apk"
          python3 - <<'PY'
          import os, sys, zipfile
          apk = "app/app/build/outputs/apk/release/app-release.apk"
          # Fragmen endpoint yang TIDAK BOLEH ada polos di DEX maupun .so.
          # (Hanya boolean yang dicetak — nilai URL tidak pernah ditulis.)
          FORBIDDEN = [
              b"hozinking.my.id",
              b"workers.dev",
              b"raw.githubusercontent.com",
              b"github.com/hozin-king",
              b"/api/cerpen-",
              b"/api/share",
              b"/cerpen/manifest",
              b"/cerpen/all",
              b"/api/cerpen-img",
          ]
          with zipfile.ZipFile(apk) as z:
              dex = b"".join(z.read(n) for n in z.namelist() if n.startswith("classes") and n.endswith(".dex"))
              so = z.read("lib/arm64-v8a/libcontentguard.so")
          ok = True
          for frag in FORBIDDEN:
              in_dex = frag in dex
              in_so = frag in so
              print("forbidden_in_dex:", in_dex, "| forbidden_in_so:", in_so)
              ok = ok and not in_dex and not in_so
          print("ENDPOINTS_HIDDEN:", ok)
          sys.exit(0 if ok else 1)
          PY
          NDK_BIN="$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          unzip -p "$APK" lib/arm64-v8a/libcontentguard.so > /tmp/libcontentguard-poc.so
          N=$("$NDK_BIN/llvm-nm" -D --defined-only /tmp/libcontentguard-poc.so | grep -c "Java_com_hozinking_cerpen_Endpoints_")
          echo "endpoints_jni_symbols: $N"
          test "$N" -ge 33 || { echo "SIMBOL JNI Endpoints KURANG (harap >= 33)" >&2; exit 1; }

      # v1.1.38: step upload-artifact DIHAPUS — kuota storage Actions
      # akun penuh sejak 9 Nov 2026 ("Artifact storage quota has been
      # hit"); APK disalurkan lewat GitHub Release di bawah.
      - name: Create version tag
        if: github.ref == 'refs/heads/main'
        run: |
          if git rev-parse "v$APP_VERSION" >/dev/null 2>&1; then
            echo "Tag v$APP_VERSION sudah ada, lewati."
          else
            git tag "v$APP_VERSION"
            git push origin "v$APP_VERSION"
            echo "Tag v$APP_VERSION dibuat."
          fi

      - name: Rename APK for release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/app/build/outputs/apk/release/app-release.apk "CerpenHozin-v$APP_VERSION.apk"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Cerpen Hozin v${{ env.APP_VERSION }}
          generate_release_notes: true
          make_latest: true
          files: CerpenHozin-v${{ env.APP_VERSION }}.apk
