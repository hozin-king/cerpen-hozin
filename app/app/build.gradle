plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

android {
    namespace = "com.hozinking.cerpen"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.hozinking.cerpen"
        minSdk = 26
        targetSdk = 34
        versionCode = 7
        versionName = "1.1.5"
        // Argumen CMake untuk native lib `contentguard` (kunci konten).
        // HARUS di sini (defaultConfig), bukan di blok externalNativeBuild
        // atas: CmakeOptions hanya punya path/version, `arguments` hanya
        // ada di ExternalNativeCmakeOptions (per-varian).
        externalNativeBuild {
            cmake {
                arguments "-DCONTENT_KEY_MASKED=${rootProject.ext.contentKeyMaskedHex}",
                    "-DCONTENT_KEY_MASK=${rootProject.ext.contentKeyMaskHex}"
            }
        }
    }

    // Native lib `contentguard` (kunci konten). NDK 25.2.
    ndkVersion = "25.2.9519653"
    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    // Signing rilis: keystore PERSISTEN (bukan debug keystore runner).
    // Di CI, workflow mendekode secret CERPEN_KEYSTORE_BASE64 ke file dan
    // men-set CERPEN_KEYSTORE_FILE + CERPEN_KEYSTORE_PASSWORD. Tanpa env
    // ini, assembleRelease gagal eksplisit (tidak pernah rilis unsigned
    // diam-diam). Build debug tidak kena blok ini.
    signingConfigs {
        release {
            if (System.getenv("CERPEN_KEYSTORE_FILE") != null) {
                storeFile file(System.getenv("CERPEN_KEYSTORE_FILE"))
                storePassword System.getenv("CERPEN_KEYSTORE_PASSWORD")
                keyAlias "cerpen"
                keyPassword System.getenv("CERPEN_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        // Debug ikut diminifikasi agar APK kecil (target ~5 MB).
        // Keep rules di proguard-rules.pro menjaga jalur dekripsi + JNI.
        debug {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding = false
        // v1.2: BuildConfig.VERSION_NAME dipakai footer versi (Main +
        // Settings) — di AGP 8.5 ini harus diaktifkan eksplisit.
        buildConfig = true
    }

    androidResources {
        // v1.1.3: gambar komik TIDAK di-bundle ke APK — diunduh on-demand
        // lewat sync GitHub. 110 gambar ~70 MB; komik.json.enc tetap
        // ter-bundle supaya daftar komik langsung tampil. Pola default
        // aapt dipertahankan, ditambah "!komik-*" (prefix nama file —
        // PatternBasedFileFilter AGP hanya mendukung '*' di AWAL atau
        // AKHIR pola, BUKAN di tengah; "komik-*.jpg.enc" TIDAK cocok).
        // "komik.json.enc" aman (awalan "komik.", bukan "komik-").
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:!komik-*"
    }

    // Aset dibaca langsung dari data/ repo (single source of truth) +
    // src/main/assets bila ada. Ini menghindari langkah salin yang rapuh.
    sourceSets {
        getByName("main") {
            assets.srcDirs("src/main/assets", "../../data")
        }
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.recyclerview:recyclerview:1.3.2")
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
    implementation("com.google.android.material:material:1.13.0")
    implementation("androidx.core:core-ktx:1.13.1")

    // Unit test: org.json asli (android.jar hanya berisi stub yang melempar
    // "Stub!") agar NewsDetailsFormatterTest bisa jalan di JVM.
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20240303")
}

// Unit test di VM ini: worker Gradle berkomunikasi dengan daemon lewat
// loopback Java, yang rusak tanpa preferIPv4Stack (lihat AGENTS.md,
// pelajaran 18 Okt 2026: byte loopback korup — test executor mati
// dengan NPE "resultProcessor is null" sebelum menulis hasil). Di CI
// (GitHub Actions) flag ini tidak berpengaruh.
tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    jvmArgs("-Djava.net.preferIPv4Stack=true")
}
