    defaultConfig {
        applicationId = "com.hozinking.cerpen"
        minSdk = 26
        targetSdk = 34
        versionCode = 45
        versionName = "1.1.39"
    }

    // Signing rilis: keystore PERSISTEN (bukan debug keystore runner).
    // Di CI, workflow mendekode secret CERPEN_KEYSTORE_BASE64 ke file dan
    // men-set CERPEN_KEYSTORE_FILE + CERPEN_KEYSTORE_PASSWORD. Tanpa env
    // ini, assembleRelease gagal eksplisit (tidak pernah rilis unsigned
    // diam-diam). Build debug tidak kena blok ini.
    signingConfigs {
        release {
            if (System.getenv("CERPEN_KEYSTORE_FILE") != null) {
                storeFile file(System.getenv("CERPEN_KEYSTORE_FILE"))
                storePassword System.getenv("CERPEN_KEYSTORE_PASSWORD")
                keyAlias "cerpen"
                keyPassword System.getenv("CERPEN_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        // Debug ikut diminifikasi agar APK kecil (target ~5 MB).
        // Keep rules di proguard-rules.pro menjaga jalur dekripsi + JNI.
        debug {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
        release {
            // v1.1.9: minify + shrink AKTIF (dulu false) — APK ramping
            // target ~5 MB. Keep rules menjaga jalur dekripsi + JNI.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding = false
        // v1.2: BuildConfig.VERSION_NAME dipakai footer versi (Main +
        // Settings) — di AGP 8.5 ini harus diaktifkan eksplisit.
        buildConfig = true
    }

    androidResources {
        // v1.1.3: gambar komik TIDAK di-bundle ke APK — diunduh on-demand
        // lewat sync GitHub. 110 gambar ~70 MB; komik.json.enc tetap
        // ter-bundle supaya daftar komik langsung tampil. Pola default
        // aapt dipertahankan, ditambah "!komik-*" (prefix nama file —
        // PatternBasedFileFilter AGP hanya mendukung '*' di AWAL atau
        // AKHIR pola, BUKAN di tengah; "komik-*.jpg.enc" TIDAK cocok).
        // "komik.json.enc" aman (awalan "komik.", bukan "komik-").
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:!komik-*"
    }

    // v1.1.9: konten TIDAK lagi di-bundle ke APK (dulu data/ ikut
    // ter-bundle ~36 MB) — konten diunduh in-app dari repo saat
    // pertama buka / Perbarui Konten (DataManager.syncFromGithub).
    // Folder data/ tetap ada di repo sebagai sumber unduhan.
    sourceSets {
        getByName("main") {
            assets.srcDirs("src/main/assets")
        }
    }
}

// Native lib `contentguard` (kunci konten) — implementasi Rust
// (PoC, ganti C++/CMake). Lihat src/main/rust/contentguard/.
// Gradle menghitung masked key + mask (app/build.gradle, TIDAK
// berubah) lalu task ini meneruskannya sebagai env ke cargo
// (build.rs). Output .so diregenerasi tiap build ke
// src/main/jniLibs/arm64-v8a/ (JANGAN di-commit — .gitignore).
// Hanya arm64-v8a di PoC ini (target android aarch64).
tasks.register("buildRustContentGuard", Exec) {
    doFirst {
        def ndkHome = null
        def fromEnv = System.getenv("ANDROID_NDK_HOME")
        if (fromEnv != null && !fromEnv.trim().isEmpty()) {
            ndkHome = new File(fromEnv.trim())
        } else {
            def pinned = new File(android.sdkDirectory, "ndk/25.2.9519653")
            if (pinned.exists()) ndkHome = pinned
        }
        if (ndkHome == null || !ndkHome.exists()) {
            throw new GradleException("NDK tidak ditemukan. Set ANDROID_NDK_HOME atau pasang ndk;25.2.9519653.")
        }
        def clang = new File(ndkHome, "toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang")
        def llvmAr = new File(ndkHome, "toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar")
        if (!clang.exists()) throw new GradleException("clang NDK tidak ada: ${clang}")
        if (!llvmAr.exists()) throw new GradleException("llvm-ar NDK tidak ada: ${llvmAr}")
        workingDir = file("src/main/rust/contentguard")
        environment("CONTENT_KEY_MASKED", rootProject.ext.contentKeyMaskedHex)
        environment("CONTENT_KEY_MASK", rootProject.ext.contentKeyMaskHex)
        environment("CARGO_TARGET_DIR", new File(buildDir, "rust-contentguard/target").absolutePath)
        environment("CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER", clang.absolutePath)
        environment("CARGO_TARGET_AARCH64_LINUX_ANDROID_AR", llvmAr.absolutePath)
        commandLine("bash", "build-android.sh")
    }
}
// Fail-closed: APK tidak pernah di-build tanpa lib contentguard.
tasks.named("preBuild") { dependsOn("buildRustContentGuard") }

