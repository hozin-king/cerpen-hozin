android {
    namespace = "com.hozinking.cerpen"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.hozinking.cerpen"
        minSdk = 26
        targetSdk = 34
        versionCode = 2
        versionName = "1.1"
        // Argumen CMake untuk native lib `contentguard` (kunci konten).
        // HARUS di sini (defaultConfig), bukan di blok externalNativeBuild
        // atas: CmakeOptions hanya punya path/version, `arguments` hanya
        // ada di ExternalNativeCmakeOptions (per-varian).
        externalNativeBuild {
            cmake {
                arguments "-DCONTENT_KEY_MASKED=${rootProject.ext.contentKeyMaskedHex}",
                    "-DCONTENT_KEY_MASK=${rootProject.ext.contentKeyMaskHex}"
            }
        }
    }

    // Native lib `contentguard` (kunci konten). NDK 25.2.
    ndkVersion = "25.2.9519653"
    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    buildTypes {
        // Debug ikut diminifikasi agar APK kecil (target ~5 MB).
        // Keep rules di proguard-rules.pro menjaga jalur dekripsi + JNI.
        debug {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding = false
    }

    // Aset dibaca langsung dari data/ repo (single source of truth) +
    // src/main/assets bila ada. Ini menghindari langkah salin yang rapuh.
    sourceSets {
        getByName("main") {
            assets.srcDirs("src/main/assets", "../../data")
        }
    }
}

dependencies {
